name: Bootstrap repository

on:
  push:
    paths:
      - release-payload.b64

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack release bundle
        run: |
          base64 --decode release-payload.b64 > multi-style-web-ui-skills.zip
          echo "1e82c15f711c647de9387096960dbb2f1642e0602e60d3327332dd7252e8d9ae  multi-style-web-ui-skills.zip" | sha256sum -c -
          unzip -q -o multi-style-web-ui-skills.zip
          rm release-payload.b64 multi-style-web-ui-skills.zip .github/workflows/bootstrap.yml
      - name: Commit repository contents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish multi-style Web UI skill pack"
          git push
